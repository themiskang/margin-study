name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-suite:
    name: CI (Build & Public Suite)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:public
